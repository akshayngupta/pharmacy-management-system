{% extends 'base.html' %}
{% block content %}
<div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
    <h1>{{ title }}</h1>
    {% if add_url %}
    <a href="{{ add_url }}" class="btn btn-primary">Add New</a>
    {% endif %}
</div>

<div class="card">
    <table>
        <thead>
            <tr>
                {% for col in columns %}
                <th>{{ col }}</th>
                {% endfor %}
            </tr>
        </thead>
        <tbody>
            {% for item in items %}
            <tr>
                {% for key in item_keys %}
                <td>{{ item[key] }}</td>
                {% endfor %}
            </tr>
            {% else %}
            <tr>
                <td colspan="{{ columns|length }}">No records found.</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
